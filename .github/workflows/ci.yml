# CI: checks the code on every push. It does NOT touch Google Cloud, so no secrets are needed.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check scripts tests
      - name: Unit tests (synthetic data only)
        run: pytest -q
